services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: consignart_user
      POSTGRES_PASSWORD: consignart_pass
      POSTGRES_DB: consignart

volumes:
  pgdata:
